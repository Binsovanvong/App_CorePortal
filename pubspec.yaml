name: core_portal
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.3
  google_fonts: ^6.2.1
  badges: ^3.1.2
  carousel_slider: ^5.0.0
  get_storage: ^2.0.3
  flutter_svg: ^2.0.7
  dio: ^5.9.0
  pretty_dio_logger: ^1.0.0
  fl_chart: ^1.0.0
  percent_indicator: ^4.2.4
  intl: ^0.20.2
  flutter_web_auth_2: ^5.0.0
  webview_flutter: ^4.14.0
  url_launcher: ^6.2.5
  file_picker: ^11.0.2
  cached_network_image: ^3.4.1
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.3
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/asset/images/moi.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/asset/images/moi.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/asset/images/moi.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/asset/images/moi.png"

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/img/angkor_wat_silhouette.png
    - assets/asset/images/
